<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeoFylo Market</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:system-ui;background:#f4f7f2;color:#17301f}.w{max-width:1050px;margin:auto;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:26px;font-weight:900}.brand span{color:#216b3a}
.hero,.card{background:#fff;border:1px solid #dfe7df;border-radius:20px;padding:22px;margin:16px 0}
.hero h1{font-size:clamp(30px,6vw,50px);margin:0}.hero p,.meta{color:#617067}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px;margin-top:18px}
input,select,textarea,button{box-sizing:border-box;padding:12px;border-radius:11px;border:1px solid #ccd8cd;font-size:16px;font-family:inherit}
button{background:#216b3a;color:white;font-weight:bold;border:0;cursor:pointer}.soft{background:#e8f3e8;color:#216b3a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.meta{line-height:1.65}.badge{display:inline-block;background:#eef6ee;color:#216b3a;padding:5px 9px;border-radius:99px;font-weight:bold;margin-right:5px}
.price{font-size:21px;font-weight:900;color:#216b3a;margin:8px 0}.phone{margin-top:14px;font-size:17px;font-weight:800}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.contact{display:inline-block;text-decoration:none;background:#216b3a;color:#fff;padding:10px 13px;border-radius:10px;font-weight:bold}.whatsapp{background:#287a45}.interest{background:#174e2a}
.empty{grid-column:1/-1;text-align:center}.count{color:#65736a}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:50;padding:18px;overflow:auto}.modal.open{display:flex;align-items:center;justify-content:center}
.box{width:min(560px,100%);background:white;border-radius:20px;padding:22px;box-shadow:0 20px 60px #0004}.box h2{margin-top:0}.form{display:grid;gap:10px}.form input,.form textarea{width:100%}.form textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.cancel{background:#e9eeea;color:#263d2d}.notice{font-size:14px;color:#68776e}.ok{color:#216b3a;font-weight:800}.err{color:#a12626;font-weight:800}
@media(max-width:700px){.filters,.grid{grid-template-columns:1fr}.top{gap:10px}.brand{font-size:22px}}
</style>
</head>
<body>
<div class="w">
  <div class="top"><div class="brand">🌱 GeoFylo <span>Market</span></div><button class="soft" id="lang">🇬🇧 English</button></div>
  <section class="hero">
    <h1 id="title">Διαθέσιμη παραγωγή, απευθείας από παραγωγούς.</h1>
    <p id="intro">Αναζήτησε διαθέσιμα αγροτικά προϊόντα και επικοινώνησε απευθείας με τον παραγωγό.</p>
    <div class="filters">
      <input id="q" placeholder="🔎 Προϊόν ή περιοχή">
      <select id="country"><option value="">Όλες οι χώρες</option></select>
      <select id="method"><option value="">Όλοι οι τρόποι παραγωγής</option><option value="conventional">Συμβατικό</option><option value="organic">Βιολογικό</option></select>
    </div>
  </section>
  <p class="count" id="count">Φόρτωση...</p>
  <main class="grid" id="list"><div class="card empty">Φόρτωση...</div></main>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h2 id="formTitle">🤝 Εκδήλωση ενδιαφέροντος</h2>
    <p class="meta" id="formProduct"></p>
    <form class="form" id="inquiryForm">
      <input id="buyerName" required maxlength="100" placeholder="Όνομα *">
      <input id="buyerEmail" type="email" maxlength="150" placeholder="Email">
      <input id="buyerPhone" maxlength="40" placeholder="Τηλέφωνο">
      <textarea id="buyerMessage" maxlength="1000" placeholder="Μήνυμα"></textarea>
      <div class="notice" id="formNotice">Το αίτημά σου θα σταλεί στον παραγωγό.</div>
      <div class="row">
        <button type="button" class="cancel" id="cancelBtn">Ακύρωση</button>
        <button type="submit" id="sendBtn">📨 Αποστολή ενδιαφέροντος</button>
      </div>
      <div id="formStatus"></div>
    </form>
  </div>
</div>

<script>
const sb=supabase.createClient('https://yaoumcvuzvzrdcnmpmhv.supabase.co','sb_publishable_N9tUlIyCPO9wgPg42MsppQ__PRnSuax');
let rows=[],L='el',selected=null;
const $=id=>document.getElementById(id);
const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T={
 el:{title:'Διαθέσιμη παραγωγή, απευθείας από παραγωγούς.',intro:'Αναζήτησε διαθέσιμα αγροτικά προϊόντα και επικοινώνησε απευθείας με τον παραγωγό.',search:'🔎 Προϊόν ή περιοχή',countries:'Όλες οι χώρες',methods:'Όλοι οι τρόποι παραγωγής',conv:'Συμβατικό',org:'Βιολογικό',avail:'διαθέσιμα προϊόντα',none:'Δεν βρέθηκαν διαθέσιμα προϊόντα.',qty:'Ποσότητα',grade:'Ποιότητα',phone:'Τηλέφωνο',call:'📞 Κλήση',wa:'💬 WhatsApp',interest:'🤝 Ενδιαφέρομαι',form:'🤝 Εκδήλωση ενδιαφέροντος',name:'Όνομα *',email:'Email',buyerPhone:'Τηλέφωνο',message:'Μήνυμα',notice:'Το αίτημά σου θα σταλεί στον παραγωγό.',cancel:'Ακύρωση',send:'📨 Αποστολή ενδιαφέροντος',sending:'Αποστολή...',sent:'✅ Το ενδιαφέρον σου στάλθηκε επιτυχώς.',error:'❌ Δεν ήταν δυνατή η αποστολή. Δοκίμασε ξανά.'},
 en:{title:'Available produce, directly from growers.',intro:'Find available agricultural produce and contact the grower directly.',search:'🔎 Product or region',countries:'All countries',methods:'All production methods',conv:'Conventional',org:'Organic',avail:'available products',none:'No available products found.',qty:'Quantity',grade:'Grade',phone:'Phone',call:'📞 Call',wa:'💬 WhatsApp',interest:'🤝 Request offer',form:'🤝 Request offer',name:'Name *',email:'Email',buyerPhone:'Phone',message:'Message',notice:'Your request will be sent to the grower.',cancel:'Cancel',send:'📨 Send request',sending:'Sending...',sent:'✅ Your request was sent successfully.',error:'❌ Could not send your request. Please try again.'}
};
function cleanPhone(v){return String(v||'').replace(/[^\d+]/g,'')}
function whatsappPhone(v,country){let x=String(v||'').replace(/\D/g,'');if(x.startsWith('00'))x=x.slice(2);if(country==='Ελλάδα'&&x.length===10&&x.startsWith('69'))x='30'+x;return x}
function labels(){
 let t=T[L];
 $('title').textContent=t.title;$('intro').textContent=t.intro;$('q').placeholder=t.search;
 $('country').options[0].text=t.countries;$('method').options[0].text=t.methods;$('method').options[1].text=t.conv;$('method').options[2].text=t.org;
 $('lang').textContent=L==='el'?'🇬🇧 English':'🇬🇷 Ελληνικά';
 $('formTitle').textContent=t.form;$('buyerName').placeholder=t.name;$('buyerEmail').placeholder=t.email;$('buyerPhone').placeholder=t.buyerPhone;$('buyerMessage').placeholder=t.message;
 $('formNotice').textContent=t.notice;$('cancelBtn').textContent=t.cancel;$('sendBtn').textContent=t.send;
 render();
}
function render(){
 let t=T[L],s=$('q').value.toLowerCase(),c=$('country').value,m=$('method').value;
 let d=rows.filter(r=>(!s||[r.product,r.variety,r.region,r.country].some(v=>String(v||'').toLowerCase().includes(s)))&&(!c||r.country===c)&&(!m||r.production_method===m));
 $('count').textContent=d.length+' '+t.avail;
 $('list').innerHTML=d.length?d.map(r=>{
   let p=r.price==null?'—':Number(r.price).toLocaleString(L==='el'?'el-GR':'en-US',{minimumFractionDigits:2})+' '+(r.currency||'EUR');
   let ph=String(r.contact_phone||'').trim(),tel=cleanPhone(ph),wa=whatsappPhone(ph,r.country);
   return `<article class="card">
     <span class="badge">${r.production_method==='organic'?t.org:t.conv}</span>${r.grade?`<span class="badge">${t.grade} ${E(r.grade)}</span>`:''}
     <h2>${E(r.product)}${r.variety?' — '+E(r.variety):''}</h2>
     <div class="meta">📍 ${E(r.region||'—')}${r.country?', '+E(r.country):''}<br>📦 ${t.qty}: <b>${E(r.quantity)} ${E(r.unit||'kg')}</b></div>
     <div class="price">${E(p)}</div>${r.description?`<p class="meta">${E(r.description)}</p>`:''}
     ${ph?`<div class="phone">📱 ${t.phone}: ${E(ph)}</div>`:''}
     <div class="actions">
       ${ph?`<a class="contact" href="tel:${E(tel)}">${t.call}</a>${wa?`<a class="contact whatsapp" href="https://wa.me/${E(wa)}" target="_blank" rel="noopener">${t.wa}</a>`:''}`:''}
       <button class="interest" type="button" onclick="openInquiry('${E(r.id)}')">${t.interest}</button>
     </div>
   </article>`;
 }).join(''):`<div class="card empty">${t.none}</div>`;
}
function openInquiry(id){
 selected=rows.find(r=>r.id===id);
 if(!selected)return;
 $('formProduct').textContent=selected.product+(selected.variety?' — '+selected.variety:'');
 $('inquiryForm').reset();$('formStatus').textContent='';$('modal').classList.add('open');
}
function closeInquiry(){$('modal').classList.remove('open');selected=null}
window.openInquiry=openInquiry;
$('cancelBtn').onclick=closeInquiry;
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeInquiry()});
$('inquiryForm').addEventListener('submit',async e=>{
 e.preventDefault();if(!selected)return;
 let t=T[L],btn=$('sendBtn');btn.disabled=true;btn.textContent=t.sending;$('formStatus').textContent='';
 const payload={
   listing_id:selected.id,
   producer_id:selected.user_id,
   buyer_name:$('buyerName').value.trim(),
   buyer_email:$('buyerEmail').value.trim()||null,
   buyer_phone:$('buyerPhone').value.trim()||null,
   message:$('buyerMessage').value.trim()||null,
   status:'new'
 };
 const {error}=await sb.from('market_inquiries').insert(payload);
 btn.disabled=false;btn.textContent=t.send;
 if(error){console.error(error);$('formStatus').className='err';$('formStatus').textContent=t.error;return}
 $('formStatus').className='ok';$('formStatus').textContent=t.sent;
 $('buyerName').value='';$('buyerEmail').value='';$('buyerPhone').value='';$('buyerMessage').value='';
});
async function load(){
 let {data,error}=await sb.from('market_listings')
 .select('id,user_id,product,variety,quantity,unit,grade,country,region,price,currency,description,contact_phone,production_method,status,created_at')
 .eq('status','active').order('created_at',{ascending:false});
 if(error){$('list').innerHTML='<div class="card empty">⚠️ '+E(error.message)+'</div>';return}
 rows=data||[];
 [...new Set(rows.map(x=>x.country).filter(Boolean))].sort().forEach(c=>{let o=document.createElement('option');o.value=o.textContent=c;$('country').appendChild(o)});
 render();
}
$('lang').onclick=()=>{L=L==='el'?'en':'el';labels()};
$('q').oninput=render;$('country').onchange=render;$('method').onchange=render;
labels();load();
</script>
</body>
</html>
