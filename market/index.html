<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoFylo Market</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
body{margin:0;font-family:system-ui;background:#f4f7f2;color:#17301f}.w{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:26px;font-weight:900}.brand span{color:#216b3a}.hero,.card{background:#fff;border:1px solid #dfe7df;border-radius:20px;padding:22px;margin:16px 0}.hero h1{font-size:clamp(30px,6vw,50px);margin:0}.hero p{color:#617067;font-size:18px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px;margin-top:18px}input,select,button{padding:12px;border-radius:11px;border:1px solid #ccd8cd;font-size:16px}button{background:#216b3a;color:white;font-weight:bold;border:0}.soft{background:#e8f3e8;color:#216b3a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.meta{color:#68776e;line-height:1.65}.badge{display:inline-block;background:#eef6ee;color:#216b3a;padding:5px 9px;border-radius:99px;font-weight:bold;margin-right:5px}.price{font-size:21px;font-weight:900;color:#216b3a;margin:8px 0}.contact{display:inline-block;text-decoration:none;background:#216b3a;color:#fff;padding:10px 13px;border-radius:10px;font-weight:bold}.empty{grid-column:1/-1;text-align:center}.count{color:#65736a}@media(max-width:700px){.filters,.grid{grid-template-columns:1fr}}
</style></head><body><div class="w"><div class="top"><div class="brand">🌱 GeoFylo <span>Market</span></div><button class="soft" id="lang">🇬🇧 English</button></div><section class="hero"><h1 id="title">Διαθέσιμη παραγωγή, απευθείας από παραγωγούς.</h1><p id="intro">Αναζήτησε διαθέσιμα αγροτικά προϊόντα και επικοινώνησε απευθείας με τον παραγωγό.</p><div class="filters"><input id="q" placeholder="🔎 Προϊόν ή περιοχή"><select id="country"><option value="">Όλες οι χώρες</option></select><select id="method"><option value="">Όλοι οι τρόποι παραγωγής</option><option value="conventional">Συμβατικό</option><option value="organic">Βιολογικό</option></select></div></section><p class="count" id="count">Φόρτωση...</p><main class="grid" id="list"><div class="card empty">Φόρτωση...</div></main></div>
<script>
const sb=supabase.createClient('https://yaoumcvuzvzrdcnmpmhv.supabase.co','sb_publishable_N9tUlIyCPO9wgPg42MsppQ__PRnSuax');let rows=[],L='el';const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const T={el:{title:'Διαθέσιμη παραγωγή, απευθείας από παραγωγούς.',intro:'Αναζήτησε διαθέσιμα αγροτικά προϊόντα και επικοινώνησε απευθείας με τον παραγωγό.',search:'🔎 Προϊόν ή περιοχή',countries:'Όλες οι χώρες',methods:'Όλοι οι τρόποι παραγωγής',conv:'Συμβατικό',org:'Βιολογικό',avail:'διαθέσιμα προϊόντα',none:'Δεν βρέθηκαν διαθέσιμα προϊόντα.',qty:'Ποσότητα',grade:'Ποιότητα',contact:'📞 Επικοινωνία'},en:{title:'Available produce, directly from growers.',intro:'Find available agricultural produce and contact the grower directly.',search:'🔎 Product or region',countries:'All countries',methods:'All production methods',conv:'Conventional',org:'Organic',avail:'available products',none:'No available products found.',qty:'Quantity',grade:'Grade',contact:'📞 Contact'}};function labels(){let t=T[L];title.textContent=t.title;intro.textContent=t.intro;q.placeholder=t.search;country.options[0].text=t.countries;method.options[0].text=t.methods;method.options[1].text=t.conv;method.options[2].text=t.org;lang.textContent=L==='el'?'🇬🇧 English':'🇬🇷 Ελληνικά';render()}function render(){let t=T[L],s=q.value.toLowerCase(),c=country.value,m=method.value,d=rows.filter(r=>(!s||[r.product,r.variety,r.region,r.country].some(v=>String(v||'').toLowerCase().includes(s)))&&(!c||r.country===c)&&(!m||r.production_method===m));count.textContent=d.length+' '+t.avail;list.innerHTML=d.length?d.map(r=>{let p=r.price==null?'—':Number(r.price).toLocaleString(L==='el'?'el-GR':'en-US',{minimumFractionDigits:2})+' '+(r.currency||'EUR'),ph=String(r.contact_phone||'').trim();return `<article class="card"><span class="badge">${r.production_method==='organic'?t.org:t.conv}</span>${r.grade?`<span class="badge">${t.grade} ${E(r.grade)}</span>`:''}<h2>${E(r.product)}${r.variety?' — '+E(r.variety):''}</h2><div class="meta">📍 ${E(r.region||'—')}${r.country?', '+E(r.country):''}<br>📦 ${t.qty}: <b>${E(r.quantity)} ${E(r.unit||'kg')}</b></div><div class="price">${E(p)}</div>${r.description?`<p class="meta">${E(r.description)}</p>`:''}${ph?`<a class="contact" href="tel:${encodeURIComponent(ph)}">${t.contact}</a>`:''}</article>`}).join(''):`<div class="card empty">${t.none}</div>`}async function load(){let {data,error}=await sb.from('market_listings').select('product,variety,quantity,unit,grade,country,region,price,currency,description,contact_phone,production_method,status,created_at').eq('status','active').order('created_at',{ascending:false});if(error){list.innerHTML='<div class="card empty">⚠️ '+E(error.message)+'</div>';return}rows=data||[];[...new Set(rows.map(x=>x.country).filter(Boolean))].sort().forEach(c=>{let o=document.createElement('option');o.value=o.textContent=c;country.appendChild(o)});render()}lang.onclick=()=>{L=L==='el'?'en':'el';labels()};q.oninput=render;country.onchange=method.onchange=render;labels();load();
</script></body></html>
